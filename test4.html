<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Commento alla Nota 1 di Hyblon">

  <!-- parte social e indieweb-->
  <link rel="me" href="https://hyblon.codeberg.page">
  <link rel="me" href="https://social.vivaldi.net/@hyblon">
  <link rel="webmention" href="https://webmention.io/hyblon.codeberg.page/webmention">
  <meta name="fediverse:creator" content="@hyblon@vivaldi.net">

  <link rel="stylesheet" href="../commento.css">

  <title>Re: Nota 1</title>

</head>
<body>
  <nav>
    <ul>
      <li><a href="../index.html">Home</a></li>
    </ul>
  </nav>
  <article class="h-entry">
    <header>
      <h1 class="p-name">Commento alla Nota 1</h1>
      
      <div class="header-meta">
       <p class="p-author h-card">
        <strong>From:</strong>
        <a class="u-url p-name" href="https://hyblon.codeberg.page">Hyblon</a>
        <img class="u-photo" src="https://hyblon.codeberg.page/img/me.jpeg" alt="Hyblon avatar" style="display:none;">
      </p>
        <p><strong>Url:</strong> <code>hyblon.codeberg.page/test4.html</code></p>
        <a class="u-url" href="https://hyblon.codeberg.page/test4.html" style="display:none;"></a>
        <p><strong>In-Reply-To:</strong> 
          <a class="u-in-reply-to" href="https://hyblon.codeberg.page/note/00001.html" id="target-link">
            Nota 1
          </a>
        </p>
        <p><strong>Date:</strong> <time class="dt-published" datetime="2026-08-10">10 Agosto 2026</time></p>
      </div>
    </header>

    <!-- commento -->
    <main class="e-content">
      <p>Questo è un commento</p>
    </main>

    <section class="quoted-context" id="context-box">
      <div class="context-label">&gt; testo citato:</div>
      <blockquote id="quote-body">
        <!-- Fallback per chi non ha JS abilitato -->
        <a href="https://hyblon.codeberg.page/note/00001.html" target="_blank">
          Caricamento del contesto da articolo.html in corso...
        </a>
      </blockquote>
    </section>
  </article>

  <!-- micro script -->
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const targetLink = document.getElementById('target-link');
      const quoteBody = document.getElementById('quote-body');

      if (!targetLink || !quoteBody) return;

      const targetUrl = targetLink.href;

      try {
        
        const response = await fetch(targetUrl);
        
        if (!response.ok) throw new Error('HTTP status ' + response.status);

        const htmlText = await response.text();

        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlText, 'text/html');

        const extractedElement = 
          doc.querySelector('.highlight-box p') || 
          doc.querySelector('.e-content p');

        if (extractedElement) {
          quoteBody.innerHTML = `
            <p>"${extractedElement.textContent.trim()}"</p>
            <cite>— Estratto da: <strong>${doc.title || targetUrl}</strong></cite>
          `;
        } else {
          throw new Error('Nessun contenuto estraibile trovato nella fonte');
        }

      } catch (error) {
        console.warn('Impossibile caricare il contesto via fetch:', error);
        quoteBody.innerHTML = `
          <p><em>Impossibile recuperare l'anteprima automatica.</em></p>
          <a href="${targetUrl}" target="_blank">Apri l'articolo originale &rarr;</a>
        `;
      }
    });
  </script>
</body>
</html>
